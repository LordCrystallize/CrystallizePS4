
<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CRYSTALLIZE PS4 HOST</title>

<style>
:root {
  color-scheme: dark;
  --bg: #080b10;
  --surface: #0d121a;
  --surface2: #111923;
  --border: #202d3b;
  --text: #e5edf5;
  --muted: #75869a;
  --blue: #48a9ff;
  --cyan: #50d8ef;
  --green: #43e69a;
  --red: #ff6278;
  --yellow: #ffc56b;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;

  background: var(--bg);
  color: var(--text);

  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* BRAND */

#brand {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 20px;
  padding-bottom: 14px;

  border-bottom: 1px solid var(--border);

  color: var(--text);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 4px;
  text-align: left;
}

#brand b {
  font-weight: 800;
}

#brand::after {
  content: " / PS4 HOST";
  color: var(--blue);
  font-size: 10px;
  letter-spacing: 2px;
}

/* RAM */

#ramBox {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 14px;
  padding: 9px 12px;

  border: 1px solid var(--border);
  border-radius: 4px;

  background: var(--surface);
  color: var(--cyan);

  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

/* LOADING */

#spin {
  width: 25px;
  height: 25px;
  margin: 15px auto;

  border: 2px solid #25384a;
  border-top-color: var(--blue);
  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* STATUS */

#msg {
  width: 100%;
  max-width: 900px;
  margin: 10px auto;

  color: var(--blue);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1.6;
  text-align: center;
  text-transform: uppercase;
}

/* MAIN TERMINAL */

#wrap {
  width: 100%;
  max-width: 900px;
  margin: 12px auto 0;

  border: 1px solid var(--border);
  border-radius: 5px;

  background: var(--surface);
}

/* TERMINAL HEADER */

#state {
  min-height: 39px;
  margin: 0;
  padding: 11px 14px;

  border-bottom: 1px solid var(--border);

  background: var(--surface2);
  color: var(--cyan);

  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.5;
  text-transform: uppercase;
}

/* EXPLOIT OUTPUT */

#out {
  min-height: 180px;
  max-height: 62vh;
  overflow: auto;

  padding: 18px;

  background: #070b10;
  color: #c4d4e4;

  font-family: Consolas, "Courier New", monospace;
  font-size: 13px;
  line-height: 1.8;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  -webkit-overflow-scrolling: touch;
}

/* LOG MODE */

body.log #spin,
body.log #msg {
  display: none;
}

body.log #wrap {
  display: block;
}

/* SUCCESS ANIMATION */

body.done #spin {
  display: none;
}

body.done #msg {
  color: var(--green);
  animation: successPulse 1.2s ease-out;
}

body.done #msg::before {
  content: "✓ ";
}

body.done #msg::after {
  content: "SUCCESS - EXIT THE BROWSER";
  display: block;

  margin: 12px auto 0;
  padding: 12px;

  border: 1px solid rgba(67,230,154,.4);
  border-radius: 4px;

  background: rgba(67,230,154,.07);
  color: var(--green);

  font-size: 12px;
  letter-spacing: 2px;

  animation: successReveal .7s ease-out;
}

body.done #wrap {
  border-color: rgba(67,230,154,.4);
  box-shadow: 0 0 22px rgba(67,230,154,.08);
}

body.done #state {
  color: var(--green);
  border-color: rgba(67,230,154,.25);
}

@keyframes successPulse {
  0% {
    opacity: .2;
    transform: scale(.97);
  }
  60% {
    opacity: 1;
    transform: scale(1.03);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes successReveal {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* FAILURE */

body.fail #spin {
  display: none;
}

body.fail #msg {
  color: var(--red);
}

body.fail #msg::before {
  content: "! ";
}

body.fail #wrap {
  border-color: rgba(255,98,120,.4);
}

/* NOTICES */

.notice {
  margin: 12px;
  padding: 13px;

  border: 1px solid rgba(255,98,120,.35);
  border-left: 3px solid var(--red);
  border-radius: 3px;

  background: #171017;
  color: #ffb4c0;

  font-size: 12px;
  line-height: 1.7;
}

/* STATUS COLORS */

.ok {
  color: var(--green);
}

.bad {
  color: var(--red);
}

.warn {
  color: var(--yellow);
}

/* CODE */

code {
  padding: 2px 4px;
  background: #142438;
  color: var(--cyan);
  font-family: Consolas, "Courier New", monospace;
}

/* FOOTER */

.byline {
  width: 100%;
  max-width: 900px;
  margin: 18px auto 0;

  color: #526174;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: center;
}

/* RESPONSIVE */

@media (max-width: 600px) {
  body {
    padding: 16px 10px;
  }

  #brand {
    font-size: 13px;
  }

  #out {
    padding: 13px;
    font-size: 11px;
    line-height: 1.7;
  }

  #ramBox {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div id="brand"><b>CRYSTALLIZE</b></div>

<div id="ramBox">RAM: checking...</div>

<div id="spin"></div>

<div id="msg">Restart your console</div>

<div id="wrap">
  <div id="state"></div>
  <div id="out"></div>
</div>

<p class="byline">CRYSTALLIZE PS4 HOST</p>

<script type="module">
  import "./jb.js";
</script>

</body>
</html>
